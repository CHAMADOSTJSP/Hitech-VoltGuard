<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HITECH VoltGuard - SCADA Enterprise SaaS</title>
    <script src="/vendor/html5-qrcode.min.js"></script>
    <script src="/vendor/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <!-- ECRÃ DE LOGIN OBRIGATÓRIO (PROTEÇÃO DE DADOS / LGPD/GDPR) -->
    <div id="login-screen">
        <h2>HITECH VoltGuard</h2>
        <p class="sub">SCADA Enterprise SaaS</p>
        <div class="input-group"><label>Usuário</label><input type="text" id="usuario" autocomplete="username" placeholder="Seu usuário" required></div>
        <div class="input-group"><label>Senha</label><input type="password" id="senha" autocomplete="current-password" placeholder="Sua senha" required></div>
        <button type="button" class="btn-primary" data-action="login">Acessar Plataforma</button>
        <button type="button" class="link-toggle" data-action="show-register">Registar Nova Empresa (Tenant)</button>
        <div id="error-msg"></div>
    </div>

    <!-- ECRÃ DE REGISTO DE TENANT -->
    <div id="register-screen" class="is-hidden">
        <h2>Nova Organização</h2>
        <p class="sub">Self-Service Onboarding SaaS</p>
        <div class="input-group"><label>ID da Organização (Tenant)</label><input type="text" id="reg-tenant" placeholder="Ex: INDUSTRIA-ABC"></div>
        <div class="input-group"><label>Usuário CEO</label><input type="text" id="reg-user" placeholder="Ex: DiretorJoao"></div>
        <div class="input-group"><label>Senha</label><input type="password" id="reg-pass" autocomplete="new-password" minlength="12" placeholder="Mínimo de 12 caracteres" required></div>
        <button type="button" class="btn-primary" data-action="register">Criar Conta SaaS</button>
        <button type="button" class="link-toggle" data-action="show-login">← Voltar ao Login</button>
        <div id="reg-error-msg"></div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="dashboard-screen" class="is-hidden">
        <div class="dash-header">
            <div>
                <h1>HITECH VoltGuard SCADA Enterprise</h1>
                <span>Plataforma SaaS de demonstração • dados simulados • somente monitoramento</span>
            </div>
            <div class="user-info">
                <span class="badge-tenant" id="tenant-display">-</span>
                <span>Usuário: <strong id="user-display">-</strong></span>
                <span class="badge-cargo" id="cargo-display">-</span>
                <button type="button" class="btn-logout" data-action="logout">Sair</button>
            </div>
        </div>

        <div id="kpi-banner" class="kpi-container is-hidden"></div>
        <div class="nav-tabs" id="nav-tabs-container"></div>
        <div id="main-container" class="panels-grid"></div>
    </div>

    <!-- SCRIPT DE LÓGICA E INTERAÇÃO -->
    <script src="/app.js" defer></script>
</body>
</html>
